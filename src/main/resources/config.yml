# 申請と戦闘
request-timeout-seconds: 30
# PvP常時許可の申請が有効な秒数
allowlist-request-timeout-seconds: 30
# 承諾後、この秒数以内に最初の攻撃が成立しなければ承諾を取り消す
agreement-timeout-seconds: 20
combat-timeout-seconds: 20

# data.ymlへの変更をまとめて非同期保存するまでの時間（tick）
data-save-delay-ticks: 40

request-limits:
  cooldown-seconds: 5
  max-pending-sent: 3
  max-per-minute: 10
  bypass-permission: "pvpagree.bypasslimits"

# 相手の体を見ながらしゃがんで腕を振ると、離れていても申請できる。
# 申請された側が申請者を見て同じ操作を返すと承諾になる。
sneak-gesture:
  enabled: true
  require-empty-main-hand: true
  required-swings: 5
  window-seconds: 4
  max-distance: 128.0
  # 視線判定の太さ。大きすぎると別のプレイヤーを選びやすくなる。
  ray-size: 0.35
  request-progress: "&eあと{remaining}回連打すると{player}さんにPvP申請を送ります.."
  accept-progress: "&aあと{remaining}回連打すると{player}さんのPvP申請を承諾します.."
  request-sent-action-bar: "&a&l申請を送りました！"

# 申請を受信している間、短時間に首を縦へ交互に振ると承諾、横へ振ると拒否する。
# 標準では誤検知防止のため、しゃがんでいる間だけ検出する。
head-gesture:
  enabled: true
  require-sneaking: true
  required-reversals: 4
  window-seconds: 4
  minimum-step-degrees: 1.5
  minimum-amplitude-degrees: 12.0
  # もう一方の軸より何倍大きい動きを縦・横として採用するか
  axis-dominance: 1.35
  accept-progress: "&aあと{remaining}回うなずくと{player}さんの申請を承諾します.."
  deny-progress: "&cあと{remaining}回首を横に振ると{player}さんの申請を拒否します.."

fight-end:
  end-on-death: true
  end-on-world-change: true
  end-on-teleport: false

# 戦闘開始後のログアウト。戦闘状態自体は残り時間が切れるまで保持される。
combat-logout:
  enabled: true
  send-webhook: true
  webhook-message: "⚠️ {player}さんが{opponent}さんとの戦闘中にログアウトしました！"
  # {player} と {opponent} が使用可能。空なら通知のみ。
  commands: []
  # 例: commands: ["say {player} が戦闘中にログアウトしました"]

# NONE / ACTION_BAR / BOSS_BAR
combat-display:
  mode: "ACTION_BAR"
  action-bar: "&c⚔ &f{player} &7| 残り &e{seconds}秒"
  boss-bar: "&cPvP終了まで {seconds}秒"
  boss-bar-color: "RED"
  boss-bar-overlay: "PROGRESS"

sounds:
  request:
    enabled: true
    sound: "minecraft:entity.arrow.hit_player"
    volume: 1.0
    pitch: 1.0
  accepted:
    enabled: true
    sound: "minecraft:block.note_block.pling"
    volume: 1.0
    pitch: 1.0

discord-webhook:
  enabled: false
  url: ""
  username: "PvpAgree"
  # 実際の初撃が成立したときに送信される
  message: "⚔️ {player1}さんと{player2}さんがPvPを開始しました！"

minecraft-broadcast:
  enabled: true
  message: "&8[&cPvP&8] &e{player1}さんと{player2}さんがPvPを開始しました！"

